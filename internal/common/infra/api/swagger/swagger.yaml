  schemas.ProductNotFoundErrorSchema:
    properties:
      error:
        example: Product not found
        type: string
    type: object
  schemas.ProductResponseSchema:
    properties:
      active:
        example: true
        type: boolean
      category_id:
        example: 2cb7f56d-89a1-4e60-b488-65dc4ffacbc6
        type: string
      description:
        example: Lanche com carne, queijo, alface e tomate
        type: string
      id:
        example: 76fbddb3-3e2f-4f5f-a4e1-30a0a2384eae
        type: string
      images:
        items:
          $ref: '#/definitions/schemas.ImageResponseSchema'
        type: array
      name:
        example: X-Salada
        type: string
      price:
        example: 20.5
        type: number
    type: object
  schemas.UpdateCategoryRequestBodySchema:
    properties:
      active:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  schemas.UpdateCustomerRequestBodySchema:
