      cpf:
        example: "12345678901"
        type: string
      email:
        example: joao@example.com
        type: string
      name:
        example: João Silva
        type: string
    required:
    - cpf
    - email
    - name
    type: object
  schemas.UpdateKitchenOrderSchema:
    properties:
      status_id:
        type: string
    required:
    - status_id
    type: object
  schemas.UpdateProductRequestBodySchema:
    properties:
      active:
        type: boolean
      category_id:
        type: string
      description:
        type: string
      name:
        type: string
      price:
        type: number
    required:
    - category_id
    - description
    - name
    type: object
  tech_challenge_internal_customer_infra_api_schemas.ErrorMessageSchema:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
  tech_challenge_internal_kitchen-order_infra_api_schemas.ErrorMessageSchema:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
  tech_challenge_internal_order_infra_api_schemas.ErrorMessageSchema:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
  tech_challenge_internal_order_infra_api_schemas.PaymentResponseSchema:
    properties:
      data: {}
      payment_type:
        example: PIX
        type: string
    type: object
  tech_challenge_internal_product_infra_api_schemas.ErrorMessageSchema:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
host: localhost:8080
