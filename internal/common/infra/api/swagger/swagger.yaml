basePath: /v1
definitions:
  schemas.CategoryNotFoundErrorSchema:
    properties:
      error:
        example: Category not found
        type: string
    type: object
  schemas.CategoryResponseSchema:
    properties:
      active:
        example: true
        type: boolean
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: Bebidas
        type: string
    type: object
  schemas.CreateCategorySchema:
    properties:
      active:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  schemas.CreateCustomerRequestBodySchema:
    properties:
      cpf:
        example: "12345678901"
        type: string
      email:
        example: joao@example.com
        type: string
      name:
        example: João Silva
        type: string
    required:
    - cpf
    - email
    - name
    type: object
  schemas.CreateOrderItemsRequestBodySchema:
    properties:
      product_id:
        example: "123"
        type: string
      quantity:
        example: 2
        type: integer
    required:
    - product_id
    - quantity
    type: object
  schemas.CreateOrderRequestBodySchema:
    properties:
      amount:
        example: 10.5
        type: number
      customer_id:
        example: "123"
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      items:
        items:
          $ref: '#/definitions/schemas.CreateOrderItemsRequestBodySchema'
        type: array
    required:
    - items
    type: object
  schemas.CreateProductSchema:
    properties:
      active:
        type: boolean
      category_id:
        type: string
      description:
        type: string
      name:
        type: string
      price:
        type: number
    required:
    - category_id
    - description
    - name
    type: object
  schemas.CustomerNotFoundErrorSchema:
    properties:
      error:
        example: Customer not found
        type: string
    type: object
  schemas.CustomerResponseSchema:
    properties:
      cpf:
        example: "12345678901"
        type: string
      email:
        example: joao@example.com
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: João Silva
        type: string
    type: object
  schemas.ImageResponseSchema:
    properties:
      file_name:
        example: image.jpg
        type: string
      url:
        example: https://example.com/image.jpg
        type: string
    type: object
  schemas.InvalidCategoryDataErrorSchema:
    properties:
      error:
        example: Invalid category data
        type: string
    type: object
  schemas.InvalidCustomerDataErrorSchema:
    properties:
      error:
        example: Invalid customer data
        type: string
    type: object
  schemas.InvalidKitchenOrderDataErrorSchema:
    properties:
      error:
        example: Invalid kitchen order data
        type: string
    type: object
  schemas.InvalidOrderDataErrorSchema:
    properties:
      message:
        type: string
    type: object
  schemas.InvalidProductDataErrorSchema:
    properties:
      error:
        example: Invalid product data
        type: string
    type: object
  schemas.KitchenOrderNotFoundErrorSchema:
    properties:
      error:
        example: Kitchen order not found
        type: string
    type: object
  schemas.KitchenOrderResponseSchema:
    properties:
      created_at:
        example: "2023-10-01T12:00:00Z"
        type: string
      order_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      slug:
        example: "001"
        type: string
      status:
        example: Pronto
        type: string
      updated_at:
        example: "2023-10-01T12:00:00Z"
        type: string
    type: object
  schemas.OrderItemResponseSchema:
    properties:
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      product_id:
        example: "123"
        type: string
      quantity:
        example: 2
        type: integer
      unit_price:
        example: 19.99
        type: number
    type: object
  schemas.OrderNotFoundException:
    properties:
      message:
        type: string
    type: object
  schemas.OrderResponseSchema:
    properties:
      amount:
        example: 10.5
        type: number
      customer_id:
        example: "123"
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      items:
        items:
          $ref: '#/definitions/schemas.OrderItemResponseSchema'
        type: array
    type: object
