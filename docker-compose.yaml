services:
  postgres:
    image: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backbone

  elasticmq:
    image: softwaremill/elasticmq-native:1.5.7
    ports:
      - "9324:9324"   # API SQS
      - "9325:9325"   # UI
    volumes:
      - ./.docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf
    command: ["-Dconfig.file=/opt/elasticmq.conf"]
    networks:
      - backbone

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - elasticmq
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - backbone

volumes:
  postgres:

networks:
  backbone:
    driver: bridge